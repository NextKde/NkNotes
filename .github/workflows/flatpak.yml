name: Build Flatpak
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Provision isolated SDK and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree python3-gi gir1.2-flatpak-1.0 xvfb xdotool dbus-x11 imagemagick
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.kde.Sdk//6.11 org.kde.Platform//6.11 io.qt.qtwebengine.BaseApp//6.11
      - name: Pin source and record environment
        run: |
          mkdir -p tmp/evidence dist
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          manifest = json.loads(Path('packaging/flatpak/org.nextks.notes.json').read_text())
          manifest['modules'][-1]['sources'] = [{'type': 'git', 'url': 'https://github.com/NextKde/NkNotes.git', 'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}]
          Path('tmp/org.nextks.notes.json').write_text(json.dumps(manifest, indent=2) + '\n')
          environment = {'revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}
          for name, ref in (('Platform', 'org.kde.Platform/x86_64/6.11'), ('Sdk', 'org.kde.Sdk/x86_64/6.11'), ('WebEngine', 'io.qt.qtwebengine.BaseApp/x86_64/6.11')):
              environment[name] = {'ref': ref, 'commit': subprocess.check_output(['flatpak', 'info', '--user', '--show-commit', ref], text=True).strip()}
          Path('tmp/evidence/environment.json').write_text(json.dumps(environment, indent=2) + '\n')
          base = Path(subprocess.check_output(['flatpak', 'info', '--user', '--show-location', 'io.qt.qtwebengine.BaseApp//6.11'], text=True).strip())
          Path('tmp/evidence/webengine-base-manifest.json').write_bytes((base / 'files/manifest.json').read_bytes())
          PY
      - name: Build application and corresponding sources
        run: |
          flatpak-builder --user --arch=x86_64 --default-branch=stable --disable-rofiles-fuse \
            --disable-tests --keep-build-dirs --bundle-sources --state-dir="$PWD/tmp/state" --repo="$PWD/tmp/repo" \
            tmp/build tmp/org.nextks.notes.json 2>&1 | tee tmp/evidence/build.log
      - name: Run targeted regressions inside SDK
        run: |
          repository_test=$(find "$PWD/tmp/state/build" -type f -name notes-repository-test -print -quit)
          controller_test=$(find "$PWD/tmp/state/build" -type f -name notes-controller-test -print -quit)
          test -n "$repository_test"
          test -n "$controller_test"
          flatpak-builder --run tmp/build tmp/org.nextks.notes.json "$repository_test" \
            managedSandboxLockRecoversAndRejectsConcurrentWriters \
            managedFolderSummariesTrackNotesAndPreserveCreation managedLegacyFoldersGainOrderWithoutLosingIcons \
            managedFolderMoveKeepsContentsAndRejectsInvalidDrops managedFolderOrderPersistsAndReplays \
            managedDirectNoteDeletionIsPermanentAndScoped managedDirectNoteDeletionPreservesFailedItems \
            managedDirectFolderDeletionIsPermanentAndScoped managedDirectFolderDeletionProtectsRecoveryDrafts \
            2>&1 | tee tmp/evidence/repository-tests.log
          flatpak-builder --run tmp/build tmp/org.nextks.notes.json env QT_QPA_PLATFORM=offscreen "$controller_test" \
            directNoteDeletionSavesBeforeRemovingCurrentDocument failedDirectNoteDeletionKeepsCurrentDocument \
            directFolderDeletionDrainsAndClearsTheOpenDocument failedDirectFolderDeletionKeepsTheOpenDocument \
            2>&1 | tee tmp/evidence/controller-tests.log
      - name: Export bundle and exact release plan
        run: |
          /usr/bin/python3 packaging/flatpak/export-release.py --repo tmp/repo --output dist --revision "$(git rev-parse HEAD)"
          cp tmp/org.nextks.notes.json dist/org.nextks.notes.build-manifest.json
          cp tmp/evidence/environment.json dist/org.nextks.notes.build-info.json
          ostree --repo=tmp/repo ls -R app/org.nextks.notes/x86_64/stable > tmp/evidence/runtime-files.txt
          grep -Fq '/files/lib/qt6/qml/Kos/SurfaceShape/qmldir' tmp/evidence/runtime-files.txt
          grep -Fq '/files/lib/qt6/qml/Kos/SurfaceShape/libkos_surface_shape.so' tmp/evidence/runtime-files.txt
          if grep -E '/files/lib/.*libQt6(Core|Gui|Qml|Quick|Network|Widgets|DBus)\.so' tmp/evidence/runtime-files.txt; then
            echo 'Unexpected private Qt runtime in application bundle' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          environment = json.loads(Path('tmp/evidence/environment.json').read_text())
          for name in ('Platform', 'Sdk', 'WebEngine'):
              entry = environment[name]
              assert subprocess.check_output(['flatpak', 'info', '--user', '--show-commit', entry['ref']], text=True).strip() == entry['commit']
          PY
      - name: Install and exercise offline in disposable profile
        run: |
          flatpak install --user --noninteractive --assumeyes --no-deps dist/org.nextks.notes-*.flatpak
          xvfb-run -a -s '-screen 0 1360x900x24' dbus-run-session -- /usr/bin/python3 packaging/flatpak/smoke.py
      - name: Retain evidence and checksums
        run: |
          tar -C tmp -czf dist/org.nextks.notes.validation.tar.gz evidence
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextnotes-flatpak-x86_64
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nextnotes-flatpak-failure-evidence
          path: |
            tmp/evidence/
            dist/
          retention-days: 7
